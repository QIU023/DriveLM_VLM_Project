# Qwen3-VL-8B (dense) + Q-Former projector nuScenes planning SFT —
# FSDP-only 8-rank, 3-cam x 4-frame, max_length=8192 variant.
#
# Same human-readable manifest convention as qwen3_vl_8b_planning_fsdp_3cam.toml:
# the actual values are baked into
#   scripts_titan/train_titan_qwen3_vl.py::qwen3_vl_8b_planning_fsdp_3cam_qformer
# and this file is a diff-friendly record of every paper/recipe knob.
#
# Why a Q-Former here?
# --------------------
# This is a *token-budget vs L2 tradeoff* recipe for TRT deployment, NOT
# a fusion-mechanism research comparison. The stock Qwen3-VL projector
# (linear PatchMerger; see qwen3_vl_8b_planning_fsdp_3cam.toml) preserves
# all ~1680 visual tokens per sample, which is fine for HBM training but
# expensive for edge inference (KV-cache scales with context length).
# Swapping to a 64-query, 6-layer Q-Former compresses the visual budget
# ~26x at the LM input boundary, directly shrinking TRT KV-cache and
# TTFT on deploy. From-scratch Q-Former on 24K SFT samples is expected
# to underperform the pretrained-aligned linear baseline on quality
# metrics — that is the explicit, accepted trade.
#
# To launch the run (CPU build, GPU train):
#
#   torchrun --nproc-per-node=8 --no-python /usr/bin/python3 \
#       -m torchtitan.train \
#       --module scripts_titan.train_titan_qwen3_vl \
#       --config qwen3_vl_8b_planning_fsdp_3cam_qformer
#
# Smoke / pressure runs: pass `--training.steps 4 --checkpoint.no-enable`.

[meta]
model_family       = "Qwen3-VL"
model_size         = "8B"
model_hf_id        = "Qwen/Qwen3-VL-8B-Instruct"
hf_assets_path     = "assets/hf/Qwen3-VL-8B-Instruct"
dataset            = "nuscenes_planning_3cam_4f_seqlen8k_qformer"
loss_mode          = "answer_and_traj"
recipe_origin      = "AutoVLA paper recipe @ 4-frame video horizon + BLIP-2-style Q-Former projector"
variant_note       = "3-cam x 4f, seq_len=8192, projector_type=qformer (64 queries, 6 layers)"

[model]
spec_module        = "torchtitan.models.qwen3_vl"
flavor             = "8B-qformer"  # see torchtitan_qwen25/torchtitan/models/qwen3_vl/__init__.py::_8b_qformer
vocab_size         = 151936
dim                = 4096
n_layers           = 36
n_heads            = 32
n_kv_heads         = 8
head_dim           = 128
hidden_dim         = 12288
qk_norm            = true
weight_tying       = false
rope_theta         = 5e6
mrope_section      = [24, 20, 20]
# Switchable projector — "qformer" instantiates Qwen3VLQFormerProjector
# instead of the in-encoder PatchMerger as the LM-input projector.
# (NOTE: the in-encoder PatchMerger still runs to produce the encoder
# output; the Q-Former consumes its post-merger features. This is an
# open design issue — see docs/upstream_prs/005_torchtitan_qwen3_vl_qformer.md.)
projector_type     = "qformer"

[model.vision_encoder]
# Identical to the baseline; the Q-Former does not change the ViT.
dim                     = 1152
ffn_dim                 = 4304
n_layers                = 27
n_heads                 = 16
patch_size              = 16
temporal_patch_size     = 2
spatial_merge_size      = 2
out_hidden_size         = 4096
deepstack_visual_indices = [8, 16, 24]
num_position_embeddings = 2304

[model.qformer]
# See torchtitan_qwen25/torchtitan/models/qwen3_vl/qformer_projector.py.
# Defaults in __init__.py::_8b_qformer().
num_queries        = 64
num_layers         = 6
n_heads            = 8
ffn_mult           = 4
# Internal Q-Former width — DECOUPLED from lm_dim so the param count
# stays at BLIP-2 scale (~80-120M) instead of geometrically blowing up
# to ~1.2B at lm_dim=4096. BLIP-2-base uses 768; we default to 1024.
# A final Linear(internal_dim, lm_dim) lifts the compressed tokens
# back to LM width at the boundary.
internal_dim       = 1024
# in_features = vision_encoder.out_hidden_size = 4096 (post-merger path);
# switching to 1152 would consume raw ViT features (pre-merger path).
in_features        = 4096
lm_dim             = 4096
# Approximate param count: ~117.6M at the post-merger path (in_features=4096,
# internal_dim=1024, ffn_mult=4, 6 layers), matching BLIP-2 scale. See
# tests/unit_tests/test_qformer_projector.py::test_param_count_guard for
# the source-of-truth measurement.
approx_param_count = "~117.6M"

[training]
local_batch_size       = 1
seq_len                = 8192
steps                  = 10000
mixed_precision_param  = "bfloat16"
mixed_precision_reduce = "float32"

[optimizer]
lr                 = 2e-5         # same AutoVLA recipe as baseline; revisit if Q-Former needs warmup-LR boost

[lr_scheduler]
warmup_steps       = 174
decay_ratio        = 1.0
decay_type         = "linear"
min_lr_factor      = 0.1
lr_step_freq       = 696

[parallelism]
data_parallel_shard_degree = -1
tensor_parallel_degree     = 1
context_parallel_degree    = 1
pipeline_parallel_degree   = 1

[activation_checkpoint]
mode = "full"

[checkpoint]
enable               = true
interval             = 1000
keep_latest_k        = 2
export_dtype         = "bfloat16"
last_save_model_only = false

[vision_tower]
# Vision tower frozen as in the baseline; only the LM + Q-Former projector
# train. Note: the Q-Former is *new* parameters (no pretrained alignment),
# which is the main quality risk for this variant.
freeze = true

[dataloader]
image_mean          = [0.5, 0.5, 0.5]
image_std           = [0.5, 0.5, 0.5]
patch_size          = 16
temporal_patch_size = 2
spatial_merge_size  = 2
max_images_per_batch = 128
min_pixels          = 65536
max_pixels          = 16777216

[dataset.nuscenes_planning_3cam_4f_seqlen8k_qformer]
infos_path           = "data_processed/nuscenes_infos_temporal_train.pkl"
nusc_root            = "data/nuscenes"
max_length           = 8192
num_past_frames      = 4
num_future_waypoints = 6
video_fps            = 2.0
planning_cams        = ["CAM_FRONT", "CAM_FRONT_LEFT", "CAM_FRONT_RIGHT"]
require_full_future  = true
require_all_cams     = true
# Open issue: the collator must emit exactly 64 <|image_pad|> placeholders
# per visual item for the Q-Former path to scatter correctly. This wiring
# is a follow-up task; see docs/upstream_prs/005_torchtitan_qwen3_vl_qformer.md.
