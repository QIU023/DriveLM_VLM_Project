# Qwen3-VL-8B (dense) + Perceiver Resampler projector nuScenes planning SFT --
# FSDP-only 8-rank, 3-cam x 4-frame, max_length=8192 variant.
#
# Same human-readable manifest convention as qwen3_vl_8b_planning_fsdp_3cam.toml:
# the actual values are baked into
#   scripts_titan/train_titan_qwen3_vl.py::qwen3_vl_8b_planning_fsdp_3cam_resampler
# and this file is a diff-friendly record of every paper/recipe knob.
#
# Why a Perceiver Resampler here?
# -------------------------------
# This is part of a *fusion-mechanism school comparison*:
#   A.0 = Linear projector (Qwen native; pretrained alignment baseline).
#   A.1 = Q-Former-64 (BLIP-2-style; no temporal pos).
#   A.2 = PixelShuffle 2x + Linear (more aggressive spatial compression).
#   A.3 = Perceiver Resampler-64 (THIS FILE; Flamingo-style, WITH temporal pos).
#
# The Resampler's defining feature is a learnable per-frame temporal
# positional embedding added to the KV side of the cross-attention.
# For our 3-cam x 4-frame video VLA task this inductive bias should
# help the latents pool over the temporal axis more cleanly than the
# Q-Former (which treats the input as a flat token set).
#
# Like the Q-Former sibling this also gives a ~26x token-budget
# compression at the LM input boundary (~1680 -> 64 tokens), which
# matches the Q-Former's KV-cache footprint at deploy. The comparison
# we care about is **quality** at fixed token budget, not deployment
# efficiency.
#
# To launch the run (CPU build, GPU train):
#
#   torchrun --nproc-per-node=8 --no-python /usr/bin/python3 \
#       -m torchtitan.train \
#       --module scripts_titan.train_titan_qwen3_vl \
#       --config qwen3_vl_8b_planning_fsdp_3cam_resampler
#
# Smoke / pressure runs: pass `--training.steps 4 --checkpoint.no-enable`.

[meta]
model_family       = "Qwen3-VL"
model_size         = "8B"
model_hf_id        = "Qwen/Qwen3-VL-8B-Instruct"
hf_assets_path     = "assets/hf/Qwen3-VL-8B-Instruct"
dataset            = "nuscenes_planning_3cam_4f_seqlen8k_resampler"
loss_mode          = "answer_and_traj"
recipe_origin      = "AutoVLA paper recipe @ 4-frame video horizon + Flamingo-style Perceiver Resampler projector"
variant_note       = "3-cam x 4f, seq_len=8192, projector_type=perceiver_resampler (64 latents, 6 layers, T_max=32)"

[model]
spec_module        = "torchtitan.models.qwen3_vl"
flavor             = "8B-perceiver-resampler"  # see torchtitan_qwen25/torchtitan/models/qwen3_vl/__init__.py::_8b_perceiver_resampler
vocab_size         = 151936
dim                = 4096
n_layers           = 36
n_heads            = 32
n_kv_heads         = 8
head_dim           = 128
hidden_dim         = 12288
qk_norm            = true
weight_tying       = false
rope_theta         = 5e6
mrope_section      = [24, 20, 20]
# Switchable projector -- "perceiver_resampler" instantiates
# Qwen3VLPerceiverResamplerProjector instead of the in-encoder PatchMerger
# as the LM-input projector. (NOTE: the in-encoder PatchMerger still
# runs to produce the encoder output; the Resampler consumes its
# post-merger features. This is an open design issue -- see
# docs/upstream_prs/007_torchtitan_qwen3_vl_resampler.md.)
projector_type     = "perceiver_resampler"

[model.vision_encoder]
# Identical to the baseline; the Resampler does not change the ViT.
dim                     = 1152
ffn_dim                 = 4304
n_layers                = 27
n_heads                 = 16
patch_size              = 16
temporal_patch_size     = 2
spatial_merge_size      = 2
out_hidden_size         = 4096
deepstack_visual_indices = [8, 16, 24]
num_position_embeddings = 2304

[model.perceiver_resampler]
# See torchtitan_qwen25/torchtitan/models/qwen3_vl/perceiver_resampler_projector.py.
# Defaults in __init__.py::_8b_perceiver_resampler().
num_latents        = 64
num_layers         = 6
n_heads            = 16
ffn_mult           = 2     # smaller than Q-Former's 4 because the Resampler block also has a self-attn sub-layer
t_max              = 32    # temporal-pos table size (frames > 31 clamp to slot 31)
# in_features = vision_encoder.out_hidden_size = 4096 (post-merger path);
# switching to 1152 would consume raw ViT features (pre-merger path) -- see open issues.
in_features        = 4096
lm_dim             = 4096
# Measured param count at this config: ~1.21B (FFN-dominated even at
# ffn_mult=2). The spec asked for 80-110M; that target requires either
# a shrunk internal dim or fewer layers. See PR doc Open Issues. The
# source of truth is tests/unit_tests/test_perceiver_resampler_projector.py
# ::test_param_count_ballpark.
approx_param_count = "~1.21B"

[training]
local_batch_size       = 1
seq_len                = 8192
steps                  = 10000
mixed_precision_param  = "bfloat16"
mixed_precision_reduce = "float32"

[optimizer]
lr                 = 2e-5         # same AutoVLA recipe as baseline; revisit if Resampler needs warmup-LR boost

[lr_scheduler]
warmup_steps       = 174
decay_ratio        = 1.0
decay_type         = "linear"
min_lr_factor      = 0.1
lr_step_freq       = 696

[parallelism]
data_parallel_shard_degree = -1
tensor_parallel_degree     = 1
context_parallel_degree    = 1
pipeline_parallel_degree   = 1

[activation_checkpoint]
mode = "full"

[checkpoint]
enable               = true
interval             = 1000
keep_latest_k        = 2
export_dtype         = "bfloat16"
last_save_model_only = false

[vision_tower]
# Vision tower frozen as in the baseline; only the LM + Perceiver Resampler
# projector train. Note: the Resampler is *new* parameters (no pretrained
# alignment), which is the main quality risk for this variant.
freeze = true

[dataloader]
image_mean          = [0.5, 0.5, 0.5]
image_std           = [0.5, 0.5, 0.5]
patch_size          = 16
temporal_patch_size = 2
spatial_merge_size  = 2
max_images_per_batch = 128
min_pixels          = 65536
max_pixels          = 16777216

[dataset.nuscenes_planning_3cam_4f_seqlen8k_resampler]
infos_path           = "data_processed/nuscenes_infos_temporal_train.pkl"
nusc_root            = "data/nuscenes"
max_length           = 8192
num_past_frames      = 4
num_future_waypoints = 6
video_fps            = 2.0
planning_cams        = ["CAM_FRONT", "CAM_FRONT_LEFT", "CAM_FRONT_RIGHT"]
require_full_future  = true
require_all_cams     = true
# Open issue: the collator must emit exactly 64 <|image_pad|> placeholders
# per visual item for the Resampler path to scatter correctly. This wiring
# is a follow-up task; see docs/upstream_prs/007_torchtitan_qwen3_vl_resampler.md
# (shared open issue with the Q-Former sibling PR 005).
