# Qwen2.5-VL-3B nuScenes planning SFT — FSDP-only 8-rank recipe.
#
# torchtitan's CURRENT ConfigManager loads the Trainer.Config via
#   --module <python-module-path> --config <factory-function-name>
# (see torchtitan/config/manager.py:_load_config).  TOML files are NOT
# directly consumed by torchtitan trunk.  This file is therefore a
# *human-readable record* of the exact factory + CLI overrides that
# produce the run we're committing to.  The same values are baked into
# `scripts_titan/train_titan_qwen25_vl.py::qwen2_5_vl_3b_planning_fsdp`;
# this TOML exists so that reviewers can diff a single hyperparameter
# manifest without reading Python.
#
# To launch the run (CPU build of model graph, GPU training): see the
# accompanying launch shell in (TBD by Agent C).  The canonical CLI is:
#
#   torchrun --nproc-per-node=8 --no-python /usr/bin/python3 \
#       -m torchtitan.train \
#       --module scripts_titan.train_titan_qwen25_vl \
#       --config qwen2_5_vl_3b_planning_fsdp
#
# Any of the values below can be overridden via tyro CLI by passing
#   --<section>.<key> <value>
# e.g. `--training.steps 100` for a quick smoke.

[meta]
model_family       = "Qwen2.5-VL"
model_size         = "3B"
base_ckpt          = "checkpoints_qwen25/r1_prime_final_hf"
dataset            = "nuscenes_planning"
loss_mode          = "answer_and_traj"
recipe_origin      = "R1' final HF baseline -> torchtitan port"

[model]
class              = "scripts_titan.qwen2_5_vl_model.Qwen2_5_VLModel"
flavor             = "3B"
vocab_size         = 151936
dim                = 2048
n_layers           = 36
n_heads            = 16
n_kv_heads         = 2
head_dim           = 128
hidden_dim         = 11008
qk_norm            = false   # Qwen2.5 has no QK-norm
attention_bias_qkv = true    # Qwen2.5 has bias on Q/K/V
attention_bias_o   = false
weight_tying       = true
rope_theta         = 1e6
mrope_section      = [16, 24, 24]

[model.vision_encoder]
dim                  = 1280
ffn_dim              = 3420
n_layers             = 32
n_heads              = 16
patch_size           = 14
temporal_patch_size  = 2
spatial_merge_size   = 2
out_hidden_size      = 2048
deepstack_enabled    = false  # Qwen2.5-VL has no DeepStack
# Known divergences from HF Qwen2.5-VL (see qwen2_5_vl_state_dict_adapter.py):
#  - Norms: LayerNorm (torchtitan) vs RMSNorm (HF). bias=0 on load.
#  - Vision MLP: single FFN (torchtitan) vs gated Qwen2MLP (HF).
#    up_proj is dropped on load; vision encoder retrained end-to-end.
#  - Attention pattern: full block-diag (torchtitan) vs windowed +
#    fullatt_block_indexes=[7,15,23,31] (HF).  Functional but not
#    numerically equivalent.

[training]
local_batch_size      = 1
seq_len               = 2560
steps                 = 10000     # ~3 epochs over ~26k samples @ 8-way FSDP
mixed_precision_param = "bfloat16"
mixed_precision_reduce = "float32"

[optimizer]
lr                 = 2e-5
# AdamW defaults (betas, eps, weight_decay) — override via CLI if needed.

[lr_scheduler]
warmup_steps       = 39        # ratio-scaled from R1' HF baseline
decay_ratio        = 1.0
decay_type         = "cosine"
min_lr_factor      = 0.1

[parallelism]
data_parallel_shard_degree = -1   # FSDP over all 8 ranks
tensor_parallel_degree     = 1
context_parallel_degree    = 1     # Agent C will raise this once CP is wired
pipeline_parallel_degree   = 1     # Agent B will raise this once PP is wired

[activation_checkpoint]
mode = "full"

[checkpoint]
enable               = true
interval             = 1000
keep_latest_k        = 2
export_dtype         = "bfloat16"
last_save_model_only = false
# For smoke / pressure tests, pass `--checkpoint.no-enable` on the CLI.

[dataset.nuscenes_planning]
infos_path           = "data_processed/nuscenes_infos_temporal_train.pkl"
nusc_root            = "data/nuscenes"
max_length           = 2560
num_past_frames      = 4
num_future_waypoints = 6
video_fps            = 2.0
planning_cams        = ["CAM_FRONT", "CAM_FRONT_LEFT", "CAM_FRONT_RIGHT"]
require_full_future  = true
require_all_cams     = true
