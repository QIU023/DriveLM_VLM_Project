# Qwen3-VL-8B (dense) nuScenes planning SFT — FSDP-only 8-rank, 3-cam x
# 4-frame, max_length=8192 variant.
#
# torchtitan's CURRENT ConfigManager loads the Trainer.Config via
#   --module <python-module-path> --config <factory-function-name>
# (see torchtitan/config/manager.py:_load_config).  TOML files are NOT
# directly consumed by torchtitan trunk.  This file is therefore a
# *human-readable record* of the exact factory + CLI overrides that
# produce the run we're committing to.  The same values are baked into
# `scripts_titan/train_titan_qwen3_vl.py::qwen3_vl_8b_planning_fsdp_3cam`;
# this TOML exists so that reviewers can diff a single hyperparameter
# manifest without reading Python.
#
# Variant note: this is the "wider seq_len" sibling of
# qwen3_vl_8b_planning_fsdp.toml.  Both run 3-cam x 4-frame nuScenes
# planning on Qwen3-VL-8B with FSDP-8; the only delta is seq_len/max_length
# (4096 -> 8192).  Use this when token-count drift between Qwen3-VL builds
# pushes the per-sample sequence above the 4096-token budget, or when
# we add a longer ego-speed/scene-description preamble in the future.
#
# To launch the run (CPU build of model graph, GPU training):
#
#   torchrun --nproc-per-node=8 --no-python /usr/bin/python3 \
#       -m torchtitan.train \
#       --module scripts_titan.train_titan_qwen3_vl \
#       --config qwen3_vl_8b_planning_fsdp_3cam
#
# Any of the values below can be overridden via tyro CLI by passing
#   --<section>.<key> <value>
# e.g. `--training.steps 100` for a quick smoke (also pass
# `--checkpoint.no-enable` for smoke/pressure runs).

[meta]
model_family       = "Qwen3-VL"
model_size         = "8B"
model_hf_id        = "Qwen/Qwen3-VL-8B-Instruct"
hf_assets_path     = "assets/hf/Qwen3-VL-8B-Instruct"
dataset            = "nuscenes_planning_3cam_4f_seqlen8k"
loss_mode          = "answer_and_traj"
recipe_origin      = "AutoVLA paper recipe @ 4-frame video horizon"
variant_note       = "3-cam x 4f with seq_len=max_length=8192 headroom"

[model]
# Native upstream spec — see torchtitan/models/qwen3_vl/__init__.py::_8b().
# We don't redefine dims here; ConfigManager pulls them from model_registry("8B").
spec_module        = "torchtitan.models.qwen3_vl"
flavor             = "8B"
# Vision-to-LM projector. "linear" = stock Qwen3-VL PatchMerger (this file).
# See qwen3_vl_8b_planning_fsdp_3cam_qformer.toml for the 64-query
# Q-Former alternative (token-budget compressor for TRT deployment).
projector_type     = "linear"
vocab_size         = 151936
dim                = 4096
n_layers           = 36
n_heads            = 32
n_kv_heads         = 8
head_dim           = 128
hidden_dim         = 12288
qk_norm            = true   # Qwen3-VL has QK-norm (unlike Qwen2.5-VL)
weight_tying       = false  # Qwen3-VL-8B does NOT tie lm_head (unlike 2B)
rope_theta         = 5e6
mrope_section      = [24, 20, 20]

[model.vision_encoder]
dim                     = 1152
ffn_dim                 = 4304
n_layers                = 27
n_heads                 = 16
patch_size              = 16
temporal_patch_size     = 2
spatial_merge_size      = 2
out_hidden_size         = 4096
deepstack_visual_indices = [8, 16, 24]
num_position_embeddings = 2304

[training]
local_batch_size       = 1        # global batch = 8 (1 per rank * 8 DP)
seq_len                = 8192     # 3 cams * 4 frames * 140 vis tok + text/traj overhead leaves ~6k headroom
steps                  = 10000    # ~3 epochs over ~26k samples @ 8-way FSDP, global_bs=8
mixed_precision_param  = "bfloat16"
mixed_precision_reduce = "float32"

[optimizer]
lr                 = 2e-5         # AutoVLA recipe @ 4-8 frame horizon
# AdamW defaults (betas, eps, weight_decay) — override via CLI if needed.

[lr_scheduler]
# Warmup ratio-scaled to total steps per MEMORY.md "warmup-by-tokens-not-steps":
#   warmup_steps = round(0.0174 * 10000) = 174
# AutoVLA uses step-decay x0.98 every 6.96% of total steps (lr_step_freq=696);
# torchtitan's LRSchedulersContainer doesn't expose step-decay directly, so we
# approximate with linear decay over the full schedule.
warmup_steps       = 174
decay_ratio        = 1.0
decay_type         = "linear"
min_lr_factor      = 0.1
# lr_step_freq (not used by current torchtitan scheduler; reserved for
# future step-decay implementation).
lr_step_freq       = 696

[parallelism]
data_parallel_shard_degree = -1   # FSDP over all 8 ranks
tensor_parallel_degree     = 1
context_parallel_degree    = 1     # vision-attached CP is an open problem; see docs/2026-05-20_vision_cp_open_problem.md
pipeline_parallel_degree   = 1     # Agent B's PP wiring still under pressure-test for VLM fwd path

[activation_checkpoint]
# 8B model + 3-cam x 4-frame video at seq_len=8192 on 80GB H100/A100 -> full
# AC required.  Higher seq_len than the 4096 variant means activation memory
# is ~2x; full AC is the only way to fit without dropping global batch.
mode = "full"

[checkpoint]
enable               = true
interval             = 1000
keep_latest_k        = 2
export_dtype         = "bfloat16"
last_save_model_only = false
# For smoke / pressure tests, pass `--checkpoint.no-enable` on the CLI.

[vision_tower]
# Vision tower is FROZEN for planning SFT — only LM + projector train.
# This matches the prior HF Accelerate training recipe convention.
freeze = true

[dataloader]
image_mean          = [0.5, 0.5, 0.5]    # Qwen3-VL stats (NOT OpenAI-CLIP)
image_std           = [0.5, 0.5, 0.5]
patch_size          = 16                 # Qwen3-VL: 16 (Qwen2.5-VL was 14)
temporal_patch_size = 2
spatial_merge_size  = 2
max_images_per_batch = 128
min_pixels          = 65536              # = 256x256
max_pixels          = 16777216           # = 4096x4096

[dataset.nuscenes_planning_3cam_4f_seqlen8k]
infos_path           = "data_processed/nuscenes_infos_temporal_train.pkl"
nusc_root            = "data/nuscenes"
max_length           = 8192
num_past_frames      = 4
num_future_waypoints = 6
video_fps            = 2.0
planning_cams        = ["CAM_FRONT", "CAM_FRONT_LEFT", "CAM_FRONT_RIGHT"]
require_full_future  = true
require_all_cams     = true
