# Config for 4070 Ti — bf16, no quantization
# Baseline for quantization comparison

model_id: "Qwen/Qwen2.5-VL-3B-Instruct"

# LoRA (same as other configs)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# No quantization
quantize: false

# Inference
dtype: "bfloat16"
batch_size: 1
max_length: 512
num_workers: 0

# Image resolution (same as 4070ti.yaml)
min_pixels: 200704        # 256 * 28 * 28
max_pixels: 401408        # 512 * 28 * 28
