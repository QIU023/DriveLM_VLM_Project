# Config for NVIDIA GH200 (96GB HBM3)
# bf16 full precision, large batch, no quantization — max throughput

model_id: "Qwen/Qwen2.5-VL-3B-Instruct"

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Quantization
quantize: false

# Training
dtype: "bfloat16"
learning_rate: 1e-4
batch_size: 4
grad_accum_steps: 2       # effective batch = 12
num_epochs: 1
max_length: 2048
num_workers: 4
save_every: 1000

# Image resolution (pixels = N * 28 * 28)
min_pixels: 200704        # 256 * 28 * 28
max_pixels: 401408        # 512 * 28 * 28
