# Debug config for distillation hyperparameter tuning
# Minimal BS to fit alongside CRP experiments
# Run: python scripts/train_distill.py --config configs/distill_debug.yaml --mini

teacher_model_id: "/root/models/Qwen2.5-VL-32B-Instruct"
student_model_id: "/root/models/Qwen2.5-VL-3B-Instruct"

teacher_lora: null

# Student LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

quantize: false
teacher_quantize: true
dtype: "bfloat16"

# Minimal for debug
learning_rate: 2e-4
batch_size: 1
grad_accum_steps: 1
num_epochs: 1
max_length: 2048
num_workers: 0
save_every: 99999

# Smaller images to save memory
min_pixels: 200704        # 256 * 28 * 28
max_pixels: 401408        # 512 * 28 * 28

# Distillation losses
lambda_kd: 1.0
lambda_rrd: 0.5
kd_temperature: 2.0

# Layer mapping
teacher_layers: [15, 31, 47, 63]
student_layers: [8, 17, 26, 35]

crp_importance_path: precomputed/crp_importance.pt

experiment: distill_debug
val_every: 0
val_batches: 0
