base_config: gb200.yaml

# ============ Tier-1 video (multi-frame CAM_FRONT) ============
experiment: video_n4
model_id: "/workspace/models/Qwen2.5-VL-3B-Instruct"  # override base; swap to /workspace/models/Qwen2.5-VL-{7,32}B-Instruct as needed

# Video data
video_mode: true
num_frames: 4
video_fps: 2.0            # used for second_per_grid_ts -> temporal RoPE
data_path_video: data_processed/v1_1_video_n4.json

# Visual-token budget — base gb200 uses max_pixels: 401408 (= 512 * 28 * 28)
# for a single image. To keep total tokens ~constant across an N-frame clip we
# divide by N. Per-frame max_pixels here = 401408 // 4 = 100352 (= 128 * 28 * 28).
#
# IMPORTANT: Qwen2.5-VL video tokens per clip =
#     (temporal_T / temporal_patch_size) * (H / patch_size) * (W / patch_size) / merge_size**2
# With per-frame max_pixels=100352, frames are capped to ~316x316 px and the post-merge
# video grid is (T/2, 16, 30) ~= 480 tokens for 4 frames. max_length must comfortably
# exceed (#video_tokens + question + answer + ~20 special tokens).
min_pixels: 50176          # 64 * 28 * 28
max_pixels: 100352         # 128 * 28 * 28
max_length: 2048           # plenty for ~500 video tokens + text

# Training overrides — videos are heavier than single images; halve batch size.
batch_size: 2
grad_accum_steps: 4        # effective batch = 8

# Optional vision-tower LoRA (off by default). Set e.g. ["qkv", "proj"] to also
# adapt the SigLIP/ViT side.
lora_target_modules_vision: []
