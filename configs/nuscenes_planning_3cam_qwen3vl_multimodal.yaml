base_config: nuscenes_planning_full.yaml   # = R1' / A.0 baseline (1-cam × 4f, Linear)

# ============================================================================
# B.5''' — Qwen3-VL-4B backbone × 3-cam × multi-modal SFT
# ============================================================================
# Migration from B.5' (Qwen2.5-VL-3B 3-cam multimodal) to Qwen3-VL-4B for TRT
# native deploy (TRT-LLM 1.3.0rc15 modeling_qwen3vl.py registers
# Qwen3VLForConditionalGeneration; Qwen2.5-VL has no native modeling file per
# NVIDIA issues #10069, #12824).
#
# Cross-product:
#   B.5'  = Qwen2.5-VL-3B × 3-cam × {HD-map + bbox + ego}, L2 = 0.5557
#   B.5'' = Qwen3-VL-4B   × 1-cam × {HD-map + bbox + ego}, L2 = 0.5557
#   B.5''' (this)   = Qwen3-VL-4B × 3-cam × {HD-map + bbox + ego}
#
# Field-by-field 1:1 with B.5' EXCEPT model_id; everything else (modality
# stack, max_length, LR schedule, GBS, AC, epochs, save cadence) identical.
#
# Token audit 2026-05-25 on Qwen3-VL-4B processor over full 28K train + 6K val:
#   visual fixed = 3 × 2800 (per-cam @ patch=16 native 1600x900) + 64 (HD-map)
#                = 8464 LM tokens
#   total max = 9139 train / 9130 val (+~40 deepstack marker offset)
#   over 12288: 0 / 34149 = 0.00%
#   → max_length=12288 has 3109 token buffer (25.3%), well above silent-truncation risk
#   Report: docs/B5ppp_token_audit.md
#
# vs B.5' Qwen2.5-VL token math (same audit script over same data):
#   visual fixed = 3 × 3648 + 64 = 10976
#   max = 11690 (4.8% headroom over 12288)
#   B.5''' visual is -22% from patch=14→16, so max_length=12288 is more comfortable here.

experiment: nusc_planning_b5ppp_3cam_qwen3vl_multimodal

# ---- Backbone (the only deliberate change vs B.5') ------------------------
# 2026-05-26: model_id is the 4B snapshot (4B chosen; the old 2B-switch note was
# stale). AutoVLA-res fix (video 524288→240 tok/cam) makes the prompt ~1500 tok,
# so 4B fits easily at LBS=1 GA=4 — no OOM, no offload (old native-9100 OOM moot).
#
model_id: "/workspace/.hf_home/hub/models--Qwen--Qwen3-VL-4B-Instruct/snapshots/ebb281ec70b05090aa6165b016eac8ec08e71b17"
dtype: bfloat16
train_mode: full_sft

# ---- Multi-modal dataset dispatch (same as B.5') -------------------------
dataset_kind: nuscenes_planning_multimodal
dataset_class: multimodal_planning_dataset.MultiModalPlanningDataset
hdmap_dir: data/preproc/hdmap_bev
bbox_jsonl: data/preproc/bbox_egostate_{split}.jsonl
modality_dropout_p: 0.0

# ---- 3-CAM (same as B.5') -------------------------------------------------
planning_cams: ["CAM_FRONT", "CAM_FRONT_LEFT", "CAM_FRONT_RIGHT"]
planning_require_all_cams: true

# ---- Visual token budget --------------------------------------------------
# AutoVLA TOKEN-BUDGET PARITY across patch sizes (2026-05-26 fix).
#
# AutoVLA's OFFICIAL Qwen2.5-VL-3B SFT setting is min==max_pixels=109760, a
# DETERMINISTIC resolution-for-coverage budget. On Qwen2.5-VL (patch-14,
# merge-2 → 28px/merged-token) that yields ~240 post-merge visual tokens/cam,
# which our B.5' 3-cam model measured exactly (240 tok/cam, AutoVLA-faithful).
#
# The PIXEL number does NOT transfer across patch sizes — the TOKEN count must
# be preserved. Qwen3-VL-4B is patch-16 (merge-2 → 32px/merged-token), so the
# same 109760 px yields only ~36 post-merge tok/cam — far below AutoVLA's budget.
# (Empirically verified: 109760 → video_grid_thw=[2,6,12] → 36 tok/cam.)
#
# Two SEPARATE knobs are required because Qwen3-VL has distinct processors with
# DIFFERENT pixel semantics:
#   - min_pixels/max_pixels (109760)  → applied to image_processor for the
#     HD-map BEV. Per-frame cap. KEEP 109760 (matches B.5' HD-map exactly).
#   - video_min_pixels/video_max_pixels → applied to Qwen3VLVideoProcessor.
#     NOTE: the video smart_resize caps the TOTAL CLIP volume t_bar*h_bar*w_bar
#     (NOT per-frame), so this value is ~T larger than an image cap. min==max
#     forces determinism (AutoVLA style).
#
# Empirically derived (scripts probe over real 1600x900 × 4-frame nuScenes
# clips, factor=patch*merge=32, temporal_factor=2):
#   video_*_pixels=524288 → resized 256x480 → video_grid_thw=[2,16,30]
#   → post-merge = 2*(16/2)*(30/2) = 240 tok/cam  ← EXACT B.5' Qwen2.5-VL parity.
# (Plateau 520000–576000 all give 240; 524288 = 2^19 sits mid-plateau, robust.)
max_length: 12288
min_pixels: 109760           # HD-map image cap (per B.5'; per-frame)
max_pixels: 109760
video_min_pixels: 524288     # AutoVLA token-budget parity: 240 post-merge tok/cam
video_max_pixels: 524288     # min==max for deterministic resolution (AutoVLA style).
                             # TOTAL-CLIP volume cap (patch-16). Verified empirically:
                             # 1600x900×4f → thw=[2,16,30] → 240 tok/cam (== B.5' Qwen2.5).
# Result: 3 cam × 240 = 720 video tok + HD-map (~64-121) + text (~600) ≈ 1500
# total prompt — tiny vs max_length=12288, 0% truncation, no offload needed.
# NO compress_method (we want clean baseline; compression sweep happens at
# DEPLOY TIME via deploy/trt_b5ppp/bench_trt.py for true "train full, deploy
# compressed" data — apples-to-apples with FasterVLM/PruMerge literature).

# ---- AutoVLA-aligned hyperparams (same as B.5') --------------------------
learning_rate: 2.0e-5
lr_schedule: autovla_stepdecay
warmup_steps: 39                 # 1.74% × ~2243 (R1'' value)
lr_step_freq: 156                # 6.96% × ~2243 (R1'' value)
lr_step_gamma: 0.98

# ---- Throughput (2026-05-26 AutoVLA-res retrain recipe) -------------------
# AutoVLA-res (video 524288 → 240 tok/cam) makes the prompt ~1500 tok (NOT the
# old native ~9100). At ~1500 tok the old LBS=1/GA=4/AC OOM math is moot:
# LBS=4 × GA=1 × world=8 = GBS 32 fits WITHOUT AC or offload (user 2026-05-26).
# (smoke confirms no-OOM at LBS=4 no-AC before full run.)
batch_size: 4
grad_accum_steps: 1   # GBS = LBS=4 × GA=1 × world=8 = 32 (paper AutoVLA); NO grad accum
activation_checkpointing: false  # OFF — ~1500-tok prompt is light, AC not needed
gradient_checkpointing: false    # OFF
num_epochs: 3                    # paper-aligned (AutoVLA 3-cam)
planning_num_past_frames: 4

# ---- Ckpt / val cadence --------------------------------------------------
save_every: 50
val_every: 50
keep_latest_k: 2                 # safety: keep 2 latest in case one corrupt; per [[feedback_never_delete_sft_outputs]] never auto-delete final/ or any latest
val_planning_l2: true
val_full_eval: false
val_greedy_max_new_tokens: 20
full_l2_every: null              # final L2 via post-train standalone eval
