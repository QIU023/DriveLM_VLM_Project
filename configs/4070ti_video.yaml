base_config: 4070ti.yaml

# ============ Tier-1 video on 4070 Ti (12GB) ============
# Keep 4-bit quant + gradient accumulation; further shrink per-frame resolution.
experiment: video_n4_4070ti
model_id: "/workspace/models/Qwen2.5-VL-3B-Instruct"

video_mode: true
num_frames: 4
video_fps: 2.0
data_path_video: data_processed/v1_1_video_n4.json

# 4070ti base used 401408 single-image. For 4 frames at 12GB we cut more aggressively:
# 50176 per frame (= 64 * 28 * 28). With 4 frames + temporal patch grouping the
# total visual tokens are well under 800 — fits comfortably.
min_pixels: 12544          # 16 * 28 * 28
max_pixels: 50176          # 64 * 28 * 28

# Already bs=1 grad_accum=8 in base — keep.
max_length: 1536           # ~200 video tokens + text headroom

lora_target_modules_vision: []
