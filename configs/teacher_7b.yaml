# Fine-tune 7B teacher on DriveLM for distillation
# bf16 full precision, ~14GB model → plenty of room on 96GB H100

model_id: "/root/models/Qwen2.5-VL-7B-Instruct"

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# bf16 full precision
quantize: false

# Training
dtype: "bfloat16"
learning_rate: 1e-4
batch_size: 2
grad_accum_steps: 4       # effective batch = 8
num_epochs: 1
max_length: 2048
num_workers: 8
save_every: 1000

# Image resolution
min_pixels: 200704        # 256 * 28 * 28
max_pixels: 401408        # 512 * 28 * 28

experiment: teacher_7b
