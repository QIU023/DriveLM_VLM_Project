base_config: nuscenes_planning_full.yaml  # 1-cam (CAM_FRONT-only) baseline

# ============================================================================
# Track A.2 (1-cam pivot): PixelShuffle 2x + Linear projector + 1-cam × 4f
# ============================================================================
# Pivot from the 3-cam variant: 3-cam fusion didn't yield paper-level gains
# at our data scale, so the A.1/A.2/A.3 ablation series is being re-anchored
# on 1-cam to compare against A.0 = R1' (Linear, 1-cam × 4f, L2 0.642).
#
# Same forward path as configs/nuscenes_planning_3cam_pixelshuffle.yaml
# (which lives on the pixelshuffle_hf_port branch; merge before launching A.2);
# only the cam-count + step counts + max_length headroom differ.
#
# Sample count: ~21830 useable train samples. At global_bs=32 (LBS=4 ×
# grad_accum=1 × FSDP=8) -> ~683 opt steps / epoch -> ~2050 steps over 3 epochs.
#
# Token budget: baseline 1-cam × 4f emits ~140 post-merger tokens / frame ×
# 4 = ~560 tokens. PixelShuffle 2x trims 3/4 -> ~140 LM-input visual tokens
# / sample. Plus ~600 text/traj/chat-template -> easily under 4096 max_length.

experiment: nuscenes_planning_1cam_pixelshuffle_3b_full_sft

# ---- Projector switch -----------------------------------------------------
# train_lora.py reads `projector_type` and, when it equals "pixelshuffle",
# instantiates the projector with the kwargs under `pixelshuffle:`. Defaulting
# to "linear" (=base behavior) keeps every other config untouched.
projector_type: pixelshuffle
pixelshuffle:
  # in_features = post-merger feature dim = lm_dim for Qwen2.5-VL-3B (2048).
  # Leaving null so the trainer resolves from model.config.text_config.hidden_size.
  in_features: null
  lm_dim: null
  shuffle_ratio: 2

# ---- Memory / throughput rules (matched to 3cam_full overrides) ----------
# AC off (memory rule): 3B + 1-cam × 4f on 32GB cards has plenty headroom.
activation_checkpointing: false
gradient_checkpointing: false

# Throughput: LBS=4 × grad_accum=1, same GBS=32 as base, ~4x faster wallclock.
batch_size: 4
grad_accum_steps: 1

# Reliability rule: ckpt every ~30 min wallclock. save_every=50 ≈ 4-7 min/ckpt.
save_every: 50
val_every: 50
keep_latest_k: 2

# ---- Ratio-scaled schedule (paper-hyperparam audit gate) -----------------
# Same 1.74%/6.96% AutoVLA ratios applied to our ~2050 total steps.
warmup_steps: 36
lr_step_freq: 143

# ---- Mid-training planning metrics (from train_lora L2 val merge) --------
val_planning_l2: true
val_full_eval: false
val_greedy_max_new_tokens: 20
