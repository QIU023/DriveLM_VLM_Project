base_config: gb200_video.yaml

# ============ Tier-2 Video VLA (3B, full SFT, paper-aligned) ============
# Rationale: paper-standard full SFT on Qwen2.5-VL-3B without any LoRA warm-init,
# vision tower frozen (SigLIP/ViT stays as-is — only the LM is trained), and a
# conservative 5e-6 learning rate (full-model SFT is much more LR-sensitive than
# LoRA; OpenVLA / AutoVLA use 1e-5..5e-6 for the LM with the visual encoder
# frozen). 1 epoch over the full 377K DriveLM video clips ~= ~47K opt steps at
# eff_bs=64 (8x B200 * bs1 * grad_accum=8). Warmup ratio 0.03 is the OpenVLA
# default. Loss is computed on both the answer text AND the trajectory tokens
# (OpenVLA-style); switch to traj_only to ablate. AC is on to keep memory
# headroom for 4-frame video activations.
experiment: video_vla_3b_full_sft

# Clean base (NOT a Tier-1 merged dir) — the user has decided to skip Tier-1
# LoRA warm-init for the paper-standard run.
model_id: "/workspace/models/Qwen2.5-VL-3B-Instruct"

# Training topology
train_mode: full_sft         # "lora" | "full_sft" | "qlora"
freeze_vision: true          # SigLIP/ViT side frozen during Tier-2 SFT
fsdp: true                   # informational; launch with `accelerate launch --use_fsdp`
activation_checkpointing: true
gradient_checkpointing: true

# VLA: append trajectory targets to the assistant turn
vla_mode: true
vla_loss_mode: answer_and_traj   # OpenVLA-style; switch to "traj_only" to ablate
data_path_vla: data_processed/v1_1_video_n4_FULL_with_traj.json

# Vision tower stays frozen, so LoRA targets don't matter; explicitly empty.
lora_target_modules_vision: []

# Video tensors (from gb200_video.yaml): N=4, fps=2.0, max_pixels=100352 / frame.

# ============ AutoVLA-aligned (per /loop hyperparam audit gate 2026-05-19) ============
# Replicates AutoVLA SFT recipe verbatim (arxiv 2506.13757 + ucla-mobility/AutoVLA
# config/training/qwen2.5-vl-3B-mix-sft.yaml). Deviations are flagged in chat.
batch_size: 1
grad_accum_steps: 4          # AutoVLA: global batch = 1 * 4 * 8 GPU = 32 (was 8 -> 64, off-paper)
max_length: 2560             # +traj tokens vs paper 2048; ok because we have more traj tokens
learning_rate: 2.0e-5        # AutoVLA YAML; was 5e-6 (4x off-paper, wasted 5h GPU)
num_epochs: 5                # AutoVLA YAML `epochs: 5`; ~34h GPU est at grad_accum=4

# AutoVLA LR schedule: 500-step LINEAR warmup, then step-decay (no cosine).
# At step >= warmup, lr <- lr * gamma every step_freq steps.
lr_schedule: autovla_stepdecay
warmup_steps: 500            # AutoVLA YAML `lr_warmup_step: 500`
lr_step_freq: 2000           # AutoVLA YAML `lr_step_frequency: 2000`
lr_step_gamma: 0.98          # AutoVLA YAML `lr_step_gamma: 0.98`

# Visual token budget — override base gb200_video.yaml (which uses 100352).
# AutoVLA fixes pixel count via min=max=109760 (= 28^2 * 140) so each frame
# emits a deterministic token count. Required for tight max_length budgeting.
min_pixels: 109760
max_pixels: 109760

# Sliding-window loss display (per user 2026-05-19): show mean of last N batch
# losses instead of cumulative epoch average. N batches; with grad_accum=4 each
# 100 batches = 25 opt steps of smoothing.
loss_window: 100

# 80/20 scene-level held-out validation (scripts/split_train_val.py --seed 42 →
# 557 train scenes / 139 val scenes; 262,833 train / 65,298 val records).
# train_lora.py val_file convention is {data_path_vla}_val.json which matches
# data_processed/v1_1_video_n4_FULL_with_traj_val.json on disk.
val_every: 100               # match save_every cadence; ~41 val passes total
val_batches: 50              # ~2 min/val pass × 41 = ~80 min total val overhead

# Ckpt cadence: 100 opt steps. With keep_latest_k=3 disk steady ~54GB
# (3 * 18GB), peak ~72GB during save+prune. We have 163GB free.
save_every: 100
keep_latest_k: 3
