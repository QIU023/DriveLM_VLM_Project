# Combined distillation: 7B → 3B, LLaVA-KD RDist + SATS CRP RRD
# 50% SATS RRD (CRP-based O(C²)) + 50% LLaVA-KD RDist (full O(N²))
# Both models bf16, ~21GB total
# Run: python scripts/train_distill.py --config configs/distill_7b_3b_combined.yaml

teacher_model_id: "/root/models/Qwen2.5-VL-7B-Instruct"
student_model_id: "/root/models/Qwen2.5-VL-3B-Instruct"
teacher_lora: "checkpoints_qwen25/teacher_7b/final"

# Student LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

quantize: false
teacher_quantize: false
dtype: "bfloat16"

# Training
train_file: "train.json"
learning_rate: 2e-4
batch_size: 2
grad_accum_steps: 4
num_epochs: 1
max_length: 2048
num_workers: 8
save_every: 1000

# Image resolution
min_pixels: 200704
max_pixels: 401408

# Distillation losses
lambda_kd: 1.0
lambda_crp: 0.5              # base value for CRP (overridden by adaptive)
lambda_rdist: 0.5            # fixed O(N²) RDist loss
crp_adaptive: true
crp_adaptive_target: 0.2    # crp_weighted = 20% of kd_weighted
rrd_combined: true
rrd_loss_type: cosine
kd_temperature: 2.0

# Layer mapping: uniform 25/50/75/100%
# 7B:  28 LLM layers → [6, 13, 20, 27]
# 3B:  36 LLM layers → [8, 17, 26, 35]
teacher_layers: [6, 13, 20, 27]
student_layers: [8, 17, 26, 35]

crp_importance_path: precomputed/crp_importance.pt

experiment: distill_7b_3b_combined
val_every: 200
val_batches: 50
