base_config: nuscenes_planning_full.yaml

# ============================================================================
# B.5'' — Qwen3-VL-4B backbone × 1-cam × multi-modal (HD map + bbox + ego)
# ============================================================================
# Backbone switch driven by TRT-LLM deploy (`feedback_deploy_trt_llm_only`):
# TRT-LLM 1.2/1.3 does NOT support Qwen2.5-VL natively (NVIDIA went 2VL -> 3VL,
# skipping 2.5). Verified via `tensorrt_llm/_torch/models/` directory listing
# on main + 1.3.0rc15; only `modeling_qwen3vl.py` exists for the *.5 generation
# of VL models. Path C of overnight report: re-train on Qwen3-VL-4B for native
# TRT-LLM deploy.
#
# Backbone: Qwen3-VL-4B-Instruct (closest dense scale to retired 3B baseline;
# 2B = -33%, 8B = +100% train cost). Vision patch_size=16 (vs 2.5-VL=14) ->
# fewer LM tokens per frame at same resolution; max_length=6144 fits.
#
# Modalities: same as B.5 (1-cam CAM_FRONT + HD-map BEV + bbox text + ego),
# NO LiDAR per [[feedback_no_lidar_multimodal_track]] (XPeng/Tesla family).

experiment: nusc_planning_b5pp_1cam_qwen3vl_multimodal

# ---- Backbone override ---------------------------------------------------
model_id: "Qwen/Qwen3-VL-4B-Instruct"
dtype: bfloat16
train_mode: full_sft

# ---- Multi-modal dataset dispatch (same as B.5) --------------------------
dataset_kind: nuscenes_planning_multimodal
dataset_class: multimodal_planning_dataset.MultiModalPlanningDataset
hdmap_dir: data/preproc/hdmap_bev
bbox_jsonl: data/preproc/bbox_egostate_{split}.jsonl
modality_dropout_p: 0.0

# ---- 1-CAM (CAM_FRONT only) ----------------------------------------------
planning_cams: ["CAM_FRONT"]
planning_require_all_cams: true

# ---- Visual token budget --------------------------------------------------
# Qwen3-VL patch_size=16 (vs 2.5-VL=14). At native 1600x900, 4-frame video:
#   T_grid = 4 / temporal_patch_size(2) = 2
#   spatial = ceil(900/16) x ceil(1600/16) = 57 x 100
#   patches = 2 * 57 * 100 = 11400
#   LM tokens (post 2x2 merge) = 11400 / 4 = 2850 / cam
# + HD-map BEV (~256x256) post merge ~ 64
# + bbox+ego text ~ 350-600
# + chat overhead ~ 50
# + trajectory ~ 14
# = ~3350-3600 LM tokens; max_length=6144 = ~70% headroom for chat-template
# variance + system prompt growth on Qwen3-VL.
# 2026-05-25 v2: max_length bumped to fit native 1-cam (was 6144, audit max
# at native ≈ 3520, plenty of room — keep 6144 for safety buffer).
max_length: 6144
# HD-map cap = B.5'/B.5 109760 (Qwen2.5-VL videos ignored this — Qwen3-VL also
# ignores when only ONE image present at this size). DO NOT set video_max_pixels
# — let Qwen3VLVideoProcessor default ~25M cap give native 1600×900 pass-through.
# Audit cross-check: 1 cam × 2800 + 121 HD + ~600 text = ~3521 total prompt.
min_pixels: 109760
max_pixels: 109760

# ---- AutoVLA-aligned hyperparams (same as B.5'/R1''') --------------------
learning_rate: 2.0e-5
lr_schedule: autovla_stepdecay
# Total steps: 28K samples * 3 epochs / (LBS=2 * GA=2 * FSDP=8) = ~2625
# Reuse R1''-derived ratio (1.74% warmup, 6.96% step-decay period).
warmup_steps: 39
lr_step_freq: 156
lr_step_gamma: 0.98

# ---- Throughput ----------------------------------------------------------
# 4B params vs 3B is +33% compute; 1-cam (vs 3-cam) is -66% video tokens.
# Net per-step ≈ -50% vs B.5' -> ~5-7s/step. Total: 2625 * 6s = ~4.4h.
batch_size: 2
grad_accum_steps: 2   # FSDP2 + AC; LBS=2 × GA=2 × world=8 = GBS 32 paper (LBS=4 OOM'd)
activation_checkpointing: true   # AC-off test showed identical 10.5GB peak + same step time → keep on for outlier safety
gradient_checkpointing: true
num_epochs: 3
planning_num_past_frames: 4

# ---- Ckpt / val cadence --------------------------------------------------
# weights-only default (`save_optim_state` unset -> false). For 4B Qwen3-VL:
#   model.safetensors ~ 8 GB / ckpt.
# keep_latest_k=1 -> 8 GB peak (vs ~40 GB if optim state saved).
save_every: 50
val_every: 50
keep_latest_k: 1
val_planning_l2: true
val_full_eval: false
val_greedy_max_new_tokens: 20
full_l2_every: null
