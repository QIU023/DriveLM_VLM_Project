# Knowledge distillation: 32B teacher → 3B student (SATS RRD)
# B200 online distillation, ~71GB for both models
# Run: python scripts/train_distill.py --config configs/distill_32b_3b.yaml

teacher_model_id: "/root/models/Qwen2.5-VL-32B-Instruct"
student_model_id: "/root/models/Qwen2.5-VL-3B-Instruct"
teacher_lora: null

# Student LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

quantize: false
teacher_quantize: true    # 4-bit teacher to save VRAM (~18GB vs 64GB)
dtype: "bfloat16"

# Training
learning_rate: 2e-4
batch_size: 6
grad_accum_steps: 1
num_epochs: 1
max_length: 2048
num_workers: 8
save_every: 1000

# Image resolution
min_pixels: 200704        # 256 * 28 * 28
max_pixels: 401408        # 512 * 28 * 28

# Distillation losses
lambda_kd: 1.0
lambda_rrd: 10.0          # 0.5 * ~20x to compensate C² vs N² dimensionality
kd_temperature: 2.0

# Layer mapping: uniform 25/50/75/100%
# 32B: 64 LLM layers → [15, 31, 47, 63]
# 3B:  36 LLM layers → [8, 17, 26, 35]
teacher_layers: [15, 31, 47, 63]
student_layers: [8, 17, 26, 35]

crp_importance_path: precomputed/crp_importance.pt

experiment: distill_32b_3b
val_every: 200
val_batches: 50
